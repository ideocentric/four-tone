; PlatformIO project configuration.
; Lives at the repo root so CLion opens the whole repo as one project, while
; the firmware sources stay grouped under firmware/.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test
default_envs = nano

[env]
framework = arduino
platform = atmelavr
; Matches Serial.begin() in firmware/src/main.cpp
monitor_speed = 9600

; Arduino Nano (ATmega328P). The two envs differ only in bootloader upload
; speed. Genuine Nanos since 2018 use the new bootloader; many clones still
; ship the old one. If uploads fail with "not in sync", use `-e nano_old`.
[env:nano]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328
