<line x1="0.0" y1="174.0" x2="213.0" y2="174.0" class="dim"/>
<polygon points="0.0,174.0 6.0,171.0 6.0,177.0" class="arrow"/>
<polygon points="213.0,174.0 207.0,171.0 207.0,177.0" class="arrow"/>
<text x="106.5" y="169.8" class="dimtext" text-anchor="middle">71</text>
<line x1="-15.0" y1="0.0" x2="-15.0" y2="75.0" class="dim"/>
<polygon points="-15.0,0.0 -18.0,6.0 -12.0,6.0" class="arrow"/>
