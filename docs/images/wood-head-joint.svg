<text x="-19.2" y="115.8" class="dimtext" text-anchor="end">25</text>
<text x="0.0" y="201.0" class="note" text-anchor="start">The spigot cannot be turned on the glued box:</text>
<text x="0.0" y="213.0" class="note" text-anchor="start">at ø52.3 the cut would break through the</text>
<text x="0.0" y="225.0" class="note" text-anchor="start">corners of the 47 mm square interior. Turning</text>
<text x="0.0" y="237.0" class="note" text-anchor="start">this one small piece instead avoids that.</text>
</g>
<g transform="translate(1080.0,804.0)">
<text x="0.0" y="-21.0" class="title" text-anchor="start">F  ASSEMBLY</text>
<text x="0.0" y="0.0" class="note" text-anchor="start">1. Cut the four boards, the block and the collar blank.</text>
<text x="0.0" y="16.2" class="note" text-anchor="start">2. Front board: cut the window, then bevel its top edge</text>
<text x="0.0" y="32.4" class="note" text-anchor="start">   at 19.3° on the inside face to form the labium.</text>
<text x="0.0" y="48.6" class="note" text-anchor="start">3. Block: bore the inlet, cut the wind chamber pocket,</text>
<text x="0.0" y="64.8" class="note" text-anchor="start">   then the 1.5 mm windway rabbet across the front face.</text>
<text x="0.0" y="81.0" class="note" text-anchor="start">4. Collar: bore ø47 through, then turn the</text>
<text x="0.0" y="97.2" class="note" text-anchor="start">   ø52.3 x 25 spigot on one face.</text>
<text x="0.0" y="113.4" class="note" text-anchor="start">5. Glue the block between the two side boards, flush at</text>
<text x="0.0" y="129.6" class="note" text-anchor="start">   the bottom ends, block front face toward the mouth.</text>
<text x="0.0" y="145.8" class="note" text-anchor="start">6. Glue on the front and back boards. The gap between the</text>
<text x="0.0" y="162.0" class="note" text-anchor="start">   block face and the front board is the windway.</text>
<text x="0.0" y="178.2" class="note" text-anchor="start">7. Glue the collar on top, bore concentric with the</text>
<text x="0.0" y="194.4" class="note" text-anchor="start">   interior.</text>
<text x="0.0" y="210.6" class="note" text-anchor="start">8. Seal the inside with shellac. Keep it out of the windway.</text>
<text x="0.0" y="226.8" class="note" text-anchor="start"></text>
<text x="0.0" y="243.0" class="note" text-anchor="start">The PVC pipe slides over the spigot and rests on the</text>
<text x="0.0" y="259.2" class="note" text-anchor="start">collar shoulder, so the pipe's weight is carried in</text>
<text x="0.0" y="275.4" class="note" text-anchor="start">compression, not by a socket in bending.</text>
<text x="0.0" y="291.6" class="note" text-anchor="start"></text>
<text x="0.0" y="307.8" class="note" text-anchor="start">Wood movement changes the windway gap, so use quartersawn</text>
<text x="0.0" y="324.0" class="note" text-anchor="start">stock or void-free ply, and seal it.</text>
</g>
<text x="60" y="1130" style="font-size:10px;fill:#444">Critical for voicing, carried over from the tested printed head joint: windway 30 x 1.5 mm and 10 mm long, cut-up 17 mm, labium 19.3° and 32 mm wide, inlet ø10.25 mm. Other dimensions may suit stock and tooling.</text>
<text x="60" y="1146" style="font-size:10px;fill:#444">Material: quartersawn hardwood or void-free Baltic birch ply, 12 mm; front board and block in dense hardwood (maple, cherry or pear). This design has not been built or voiced.</text>
<text x="60" y="1162" style="font-size:10px;fill:#444">Source: github.com/ideocentric/four-tone  |  generated by tools/draw_wood_head_joint.py  |  CC BY-SA 4.0</text>
